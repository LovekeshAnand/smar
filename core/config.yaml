# ─────────────────────────────────────────────────────────────────────────────
# Epsilon IDE Engine v2.2 — SMAR Core Configuration
# ─────────────────────────────────────────────────────────────────────────────

model_tier: "fast"   # fast | balanced | deep | auto

# ── llama-server binary ───────────────────────────────────────────────────────
llama_server_bin: "C:\\Users\\ZBook\\.docker\\bin\\inference\\llama-server.exe"

# ── Model definitions ─────────────────────────────────────────────────────────
models:
  fast:
    path:        "d:/smar/core/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
    gpu_layers:  20
    context_len: 2048
    max_tokens:  256
    temperature: 0.3
    description: "Qwen2.5-Coder 7B — intelligent, multilingual conversational reasoning"

  balanced:
    path:        "d:/smar/core/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
    gpu_layers:  20
    context_len: 2048
    max_tokens:  512
    temperature: 0.2
    description: "Qwen2.5-Coder 7B — full task and memory generation"

  deep:
    path:        "D:/Personal Projects/epsilon/v2/BitNet/models/DeepSeek-Coder-33B/deepseek-coder-33b-instruct.Q4_K_M.gguf"
    gpu_layers:  0
    context_len: 4096
    max_tokens:  2048
    temperature: 0.1
    description: "DeepSeek-Coder 33B — system design and architecture"

# ── Complexity thresholds ─────────────────────────────────────────────────────
routing:
  fast_max:     2
  balanced_max: 6
  deep_min:     7

# ── Server settings ───────────────────────────────────────────────────────────
server_port: 8088
server_host: "127.0.0.1"
cpu_threads: 4

# ── Memory and search ─────────────────────────────────────────────────────────
db_path:        "d:/smar/data/clara.db"
project_dir:    "d:/smar"
crawl_on_start: false
memory_path:    "d:/smar/data/conversation.json"
memory_turns:   10

# ── VRAM management ───────────────────────────────────────────────────────────
idle_timeout: 300

# ── Debug ─────────────────────────────────────────────────────────────────────
debug:     false
log_level: "INFO"